<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Veranstaltungskalender</title>
  <desc id="desc">Stilisierter Kalender mit Veranstaltungsmarkern und Positions-Pin</desc>
  <defs>
    <!-- Hintergrund-Gradient (ODAS-Standard) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7" />
      <stop offset="100%" stop-color="#3d3fa5" />
    </linearGradient>
    <!-- Schatten-Filter (ODAS-Standard) -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hintergrund: Abgerundetes Quadrat (ODAS-Standard) -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Glanz-Overlay oben-links -->
  <ellipse cx="154" cy="132" rx="170" ry="142" fill="#ffffff" fill-opacity="0.11" />

  <!-- Motiv: Kalenderblatt mit Event-Pins -->
  <g filter="url(#shadow)">

    <!-- Kalender-Ringe -->
    <rect x="164" y="96" width="18" height="52" rx="9" fill="#ffffff" />
    <rect x="330" y="96" width="18" height="52" rx="9" fill="#ffffff" />

    <!-- Kalender-Kopf -->
    <rect x="112" y="122" width="288" height="72" rx="24" fill="#ffffff" />

    <!-- Kalender-Körper -->
    <rect x="112" y="158" width="288" height="240" rx="28" fill="#ffffff" />

    <!-- Termin-Punkte im Kalender -->
    <circle cx="172" cy="228" r="17" fill="#3d3fa5" />
    <circle cx="256" cy="228" r="17" fill="#3d3fa5" fill-opacity="0.45" />
    <circle cx="340" cy="228" r="17" fill="#3d3fa5" fill-opacity="0.45" />
    <circle cx="172" cy="300" r="17" fill="#3d3fa5" fill-opacity="0.45" />
    <circle cx="340" cy="300" r="17" fill="#3d3fa5" fill-opacity="0.45" />

    <!-- Akzent-Termin (Musik-Note als hervorgehobenes Event) -->
    <g transform="translate(226 262)">
      <path d="M 22 4 L 22 46 L 12 46 L 12 12 Z" fill="#ec4899" />
      <ellipse cx="12" cy="48" rx="14" ry="11" fill="#ec4899" />
      <ellipse cx="36" cy="42" rx="14" ry="11" fill="#ec4899" />
    </g>

    <!-- Positions-Pin (Veranstaltungsort) -->
    <g transform="translate(340 318)">
      <path d="M 34 0 C 15 0 0 15 0 34 C 0 58 34 92 34 92 C 34 92 68 58 68 34 C 68 15 53 0 34 0 Z" fill="#10b981" />
      <circle cx="34" cy="33" r="13" fill="#ffffff" />
    </g>
  </g>
</svg>
